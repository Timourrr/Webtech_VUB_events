services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vub_events
      POSTGRES_USER: vub_events
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vub_events -d vub_events"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
